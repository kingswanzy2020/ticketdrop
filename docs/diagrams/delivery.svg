<rect x="149.3" y="99.2" width="41.4" height="21.5" rx="4" fill="#ffffff"/>
<rect x="670.4" y="99.2" width="49.2" height="21.5" rx="4" fill="#ffffff"/>
<rect x="955.6" y="204.2" width="213.8" height="21.5" rx="4" fill="#ffffff"/>
<rect x="579.3" y="321.2" width="41.4" height="21.5" rx="4" fill="#ffffff"/>
<text font-size="16" text-anchor="middle" fill="#868e96" font-weight="600"><tspan x="80.0" y="116.0">You</tspan></text>
<text font-size="16" text-anchor="middle" fill="#099268" font-weight="600"><tspan x="295.0" y="106.0">Pull request</tspan><tspan x="295.0" y="126.0">to the app repo</tspan></text>
<text font-size="16" text-anchor="middle" fill="#099268" font-weight="600"><tspan x="560.0" y="106.0">CI checks</tspan><tspan x="560.0" y="126.0">lint · test · scan</tspan></text>
<text font-size="16" text-anchor="middle" fill="#099268" font-weight="600"><tspan x="820.0" y="116.0">Merge to main</tspan></text>
<text font-size="16" text-anchor="middle" fill="#099268" font-weight="600"><tspan x="1070.0" y="106.0">Build image,</tspan><tspan x="1070.0" y="126.0">push to ECR</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="170.0" y="115.2">push</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="695.0" y="115.2">green</tspan></text>
<text font-size="16" text-anchor="middle" fill="#099268" font-weight="600"><tspan x="1055.0" y="318.0">Commit the new</tspan><tspan x="1055.0" y="338.0">image tag to the</tspan><tspan x="1055.0" y="358.0">GitOps repo</tspan></text>
<text font-size="16" text-anchor="middle" fill="#6741d9" font-weight="600"><tspan x="750.0" y="328.0">Argo CD sees</tspan><tspan x="750.0" y="348.0">the commit</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="450.0" y="318.0">Pods roll to the</tspan><tspan x="450.0" y="338.0">new image, a few</tspan><tspan x="450.0" y="358.0">at a time</tspan></text>
<text font-size="16" text-anchor="middle" fill="#2f9e44" font-weight="600"><tspan x="140.0" y="318.0">Readiness passes,</tspan><tspan x="140.0" y="338.0">or the rollout</tspan><tspan x="140.0" y="358.0">stops</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="1062.5" y="220.2">tagged with the commit SHA</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="600.0" y="337.2">sync</tspan></text>
<text font-size="15" text-anchor="start" fill="#1e1e1e"><tspan x="40.0" y="445.0">The pipeline never talks to the cluster. Argo CD, running inside it, pulls from Git.</tspan><tspan x="40.0" y="463.8">So no cluster credential ever lives in GitHub.</tspan></text>
</svg>