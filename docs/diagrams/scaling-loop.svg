<text font-size="34" text-anchor="start" fill="#1e1e1e"><tspan x="40.0" y="54.0">What happens when a drop opens</tspan></text>
<text font-size="16" text-anchor="start" fill="#495057"><tspan x="40.0" y="86.0">queue backlog  -&gt;  KEDA adds pods  -&gt;  Karpenter adds nodes  -&gt;  backlog drains  -&gt;  both scale back</tspan></text>
<text font-size="17" text-anchor="start" fill="#1e1e1e"><tspan x="54.0" y="176.5">A drop opens</tspan></text>
<text font-size="13" text-anchor="start" fill="#495057"><tspan x="54.0" y="196.5">orders flood in</tspan></text>
<text font-size="17" text-anchor="start" fill="#1e1e1e"><tspan x="540.0" y="176.5">fulfillment queue</tspan></text>
<text font-size="13" text-anchor="start" fill="#495057"><tspan x="540.0" y="196.5">messages pile up</tspan></text>
<text font-size="17" text-anchor="start" fill="#1e1e1e"><tspan x="914.0" y="176.5">KEDA</tspan></text>
<text font-size="13" text-anchor="start" fill="#495057"><tspan x="914.0" y="196.5">adds fulfillment pods</tspan></text>
<text font-size="17" text-anchor="start" fill="#1e1e1e"><tspan x="1400.0" y="176.5">Pods are Pending</tspan></text>
<text font-size="13" text-anchor="start" fill="#495057"><tspan x="1400.0" y="196.5">the nodes are full</tspan></text>
<text font-size="17" text-anchor="start" fill="#1e1e1e"><tspan x="1344.0" y="376.5">Karpenter</tspan></text>
<text font-size="13" text-anchor="start" fill="#495057"><tspan x="1344.0" y="396.5">launches Spot nodes</tspan></text>
<text font-size="17" text-anchor="start" fill="#1e1e1e"><tspan x="970.0" y="376.5">Pods start</tspan></text>
<text font-size="13" text-anchor="start" fill="#495057"><tspan x="970.0" y="396.5">the backlog drains</tspan></text>
<text font-size="17" text-anchor="start" fill="#1e1e1e"><tspan x="484.0" y="376.5">KEDA</tspan></text>
<text font-size="13" text-anchor="start" fill="#495057"><tspan x="484.0" y="396.5">queue empty: back to zero</tspan></text>
<text font-size="17" text-anchor="start" fill="#1e1e1e"><tspan x="54.0" y="376.5">Karpenter</tspan></text>
<text font-size="13" text-anchor="start" fill="#495057"><tspan x="54.0" y="396.5">removes the empty nodes</tspan></text>
<text font-size="14" text-anchor="middle" fill="#e8590c"><tspan x="405.0" y="184.2">1</tspan></text>
<text font-size="14" text-anchor="middle" fill="#e8590c"><tspan x="835.0" y="184.2">2  over target</tspan></text>
<text font-size="14" text-anchor="middle" fill="#6741d9"><tspan x="1265.0" y="184.2">3</tspan></text>
<text font-size="14" text-anchor="middle" fill="#6741d9"><tspan x="1490.0" y="284.2">4</tspan></text>
<text font-size="14" text-anchor="middle" fill="#6741d9"><tspan x="1265.0" y="384.2">5  ~1 minute</tspan></text>
<text font-size="14" text-anchor="middle" fill="#e8590c"><tspan x="835.0" y="384.2">6</tspan></text>
<text font-size="14" text-anchor="middle" fill="#6741d9"><tspan x="405.0" y="384.2">7</tspan></text>
<text font-size="14" text-anchor="middle" fill="#f08c00" font-weight="600"><tspan x="360.0" y="496.0">KEDA decides how many pods. Karpenter decides how many machines.</tspan><tspan x="360.0" y="513.5">Phase 2 proves the KEDA half on your laptop; Karpenter needs AWS (Phase 5).</tspan></text>
<text font-size="15" text-anchor="start" fill="#1e1e1e"><tspan x="914.0" y="485.0">Legend</tspan></text>
<text font-size="14" text-anchor="start" fill="#343a40"><tspan x="970.0" y="513.0">Load: orders and queue depth</tspan></text>
<text font-size="14" text-anchor="start" fill="#343a40"><tspan x="970.0" y="539.0">A controller acting</tspan></text>
</svg>