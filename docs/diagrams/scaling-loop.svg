<text font-size="16" text-anchor="middle" fill="#868e96" font-weight="600"><tspan x="140.0" y="111.0">A drop opens:</tspan><tspan x="140.0" y="131.0">orders flood in</tspan></text>
<text font-size="16" text-anchor="middle" fill="#e8590c" font-weight="600"><tspan x="470.0" y="111.0">The fulfillment</tspan><tspan x="470.0" y="131.0">queue backs up</tspan></text>
<text font-size="16" text-anchor="middle" fill="#6741d9" font-weight="600"><tspan x="800.0" y="111.0">KEDA adds</tspan><tspan x="800.0" y="131.0">fulfillment pods</tspan></text>
<text font-size="16" text-anchor="middle" fill="#f08c00" font-weight="600"><tspan x="1135.0" y="111.0">New pods are Pending:</tspan><tspan x="1135.0" y="131.0">the nodes are full</tspan></text>
