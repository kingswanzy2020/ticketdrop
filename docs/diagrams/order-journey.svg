<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="340.0" y="-44.0">scheduler</tspan><tspan x="340.0" y="-24.0">keeps the time</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="635.0" y="-44.0">catalog</tspan><tspan x="635.0" y="-24.0">opens the drop</tspan></text>
<text font-size="16" text-anchor="middle" fill="#868e96" font-weight="600"><tspan x="-90.0" y="126.0">Customer</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="105.0" y="116.0">web</tspan><tspan x="105.0" y="136.0">the shopfront</tspan></text>
<text font-size="16" text-anchor="middle" fill="#0c8599" font-weight="600"><tspan x="340.0" y="116.0">gateway</tspan><tspan x="340.0" y="136.0">listed routes only</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="635.0" y="116.0">orders</tspan><tspan x="635.0" y="136.0">accepts the order</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="975.0" y="116.0">inventory</tspan><tspan x="975.0" y="136.0">holds the tickets</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="485.0" y="-34.8">it is time (HTTP)</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="852.5" y="30.2">drop.opened</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="0.0" y="125.2">buys</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="215.0" y="125.2">API</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="485.0" y="125.2">forwards</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="805.0" y="125.2">hold (HTTP)</tspan></text>
<text font-size="13" text-anchor="start" fill="#e8590c"><tspan x="620.0" y="235.0">Each arrow in this band is an event: outbox → SNS topic → the consumer&#x27;s SQS queue</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="165.0" y="348.0">payments</tspan><tspan x="165.0" y="368.0">charges the card</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="445.0" y="348.0">inventory</tspan><tspan x="445.0" y="368.0">confirms the hold</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="725.0" y="348.0">fulfillment</tspan><tspan x="725.0" y="368.0">issues the tickets</tspan></text>
<text font-size="16" text-anchor="middle" fill="#2f9e44" font-weight="600"><tspan x="1010.0" y="348.0">orders</tspan><tspan x="1010.0" y="368.0">marks it ticketed</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="400.0" y="240.2">order.created</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="305.0" y="348.5">payment.</tspan><tspan x="305.0" y="366.0">succeeded</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="585.0" y="348.5">order.</tspan><tspan x="585.0" y="366.0">confirmed</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="865.0" y="348.5">ticket.</tspan><tspan x="865.0" y="366.0">issued</tspan></text>
<text font-size="16" text-anchor="middle" fill="#e03131" font-weight="600"><tspan x="90.0" y="548.0">Card declined:</tspan><tspan x="90.0" y="568.0">inventory releases the tickets,</tspan><tspan x="90.0" y="588.0">orders marks the order failed</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="127.5" y="457.2">payment.failed</tspan></text>
<text font-size="16" text-anchor="middle" fill="#e03131" font-weight="600"><tspan x="445.0" y="548.0">No payment answer in 10 minutes:</tspan><tspan x="445.0" y="568.0">inventory releases the tickets,</tspan><tspan x="445.0" y="588.0">orders marks the order failed</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="445.0" y="457.2">hold.expired</tspan></text>
<text font-size="16" text-anchor="middle" fill="#f08c00" font-weight="600"><tspan x="800.0" y="548.0">A message that fails 3 times</tspan><tspan x="800.0" y="568.0">moves to that queue&#x27;s</tspan><tspan x="800.0" y="588.0">dead-letter queue</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="762.5" y="457.2">cannot be handled</tspan></text>
<text font-size="16" text-anchor="middle" fill="#1971c2" font-weight="600"><tspan x="1100.0" y="548.0">notifications</tspan><tspan x="1100.0" y="568.0">tells the customer</tspan><tspan x="1100.0" y="588.0">how it ended</tspan></text>
<text font-size="14" text-anchor="middle" fill="#1e1e1e"><tspan x="1055.0" y="448.5">order.ticketed</tspan><tspan x="1055.0" y="466.0">or order.failed</tspan></text>
